    <style>
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          url('/assets/images/main/first-section.pattern.svg'),
          linear-gradient(
            180deg,
            #f5f2ed 0%,
            #faf8f5 25%,
            #ffffff 50%,
            #faf8f5 75%,
            #f5f2ed 100%
          );
        opacity: 1;
        transition: opacity 0.6s ease-out;
      }

      .app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader-badge-wrapper {
        position: relative;
        width: 6rem;
        height: 6rem;
      }

      .loader-progress {
        position: absolute;
        inset: -8px;
        width: calc(100% + 16px);
        height: calc(100% + 16px);
        transform: rotate(-90deg);
      }

      .loader-progress-track {
        fill: none;
        stroke: rgba(201, 165, 92, 0.15);
        stroke-width: 2;
      }

      .loader-progress-fill {
        fill: none;
        stroke: #c9a55c;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 289;
        stroke-dashoffset: 216;
        animation: spin 1.4s linear infinite;
        transform-origin: center;
      }

      .loader-badge {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #002706 0%, #003d0a 100%);
        border-radius: 50%;
        border: 2px solid rgba(201, 165, 92, 0.4);
        box-shadow:
          0 4px 24px rgba(201, 165, 92, 0.35),
          0 2px 8px rgba(0, 39, 6, 0.2),
          inset 0 1px 0 rgba(201, 165, 92, 0.2);
      }

      .loader-badge img {
        width: 60%;
        height: auto;
        object-fit: contain;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
