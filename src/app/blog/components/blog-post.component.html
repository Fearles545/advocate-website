<section class="page-bg-pattern">
  <div class="page-content">
    @if (blog()) {
      <!-- Breadcrumb Navigation -->
      <nav class="breadcrumb">
        <a routerLink="/blog" class="back-link">
          <mat-icon>arrow_back</mat-icon>
          <span>Блог</span>
        </a>

        <div class="breadcrumb-badge">
          <mat-icon>article</mat-icon>
        </div>
      </nav>

      <!-- Page Header (outside article card) -->
      <header class="article-header">
        <h1 class="article-title">{{ blog()!.title }}</h1>

        <!-- Meta Card -->
        <div class="article-meta-card">
          <!-- Row 1: Date & Social Share -->
          <div class="meta-row meta-row-primary">
            <time class="meta-date" [attr.datetime]="blog().date">
              <mat-icon>calendar_month</mat-icon>
              <span>{{ blog().date | date: 'dd.MM.yyyy' }}</span>
            </time>

            <app-social-share [blog]="blog()!" />
          </div>

          <!-- Row 2: Categories -->
          @if (blog().categories?.length) {
            <div class="meta-row meta-row-categories">
              <div class="categories-list">
                <span class="categories-label">Категорії</span>
                @for (cat of blog().categories; track cat) {
                  <a
                    [routerLink]="['/blog']"
                    [queryParams]="{ category: cat }"
                    class="category-tag"
                  >
                    {{ getCategoryLabel(cat) }}
                  </a>
                }
              </div>
            </div>
          }
        </div>
      </header>

      <!-- Article Container -->
      <article class="blog-article">
        <!-- Video Section -->
        @if (blog().src[0]) {
          <app-blog-iframe [src]="blog().src" [title]="blog().title" />
        }

        <!-- Content -->
        <div class="article-content">
          <section
            class="blog-post-section"
            [innerHTML]="blogHtml() | async"
          ></section>
        </div>

        <!-- FAQ -->
        <app-blog-faq [category]="blog()!.categories?.[0]" />

        <!-- Related Articles -->
        <app-related-articles [currentBlog]="blog()!" />

        <!-- Footer Card -->
        <aside class="article-footer">
          <section
            class="blog-post-section"
            [innerHTML]="footerCard() | async"
          ></section>
        </aside>

        <!-- Links & CTA -->
        <app-blog-links />
      </article>

      <!-- Navigator -->
      <app-blogs-navigator [currentBlog]="blog()" />
    }

    <app-spinner [show]="isLoading()" />
  </div>
</section>
