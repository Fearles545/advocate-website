Для реалізації роутингу для блогу на Markdown-файлах, ви можете налаштувати динамічний маршрут в Angular. Це дозволить вам мати єдиний компонент для відображення всіх постів.

## Налаштування роутингу

1.  **Додайте динамічний маршрут:** У файлі `app-routing.module.ts` або аналогічному, додайте маршрут, який приймає параметр. Цей параметр буде ідентифікатором вашого посту (наприклад, назвою файлу).

    ```typescript
    const routes: Routes = [
      // інші маршрути
      { path: 'blog', component: BlogListComponent },
      { path: 'blog/:slug', component: BlogPostComponent }
    ];
    ```

    Тут `BlogListComponent` відповідатиме за відображення списку всіх постів, а `BlogPostComponent` — за відображення конкретного посту.

-----

## Конфігурація та компоненти

2.  **Створіть компонент списку постів (`BlogListComponent`):** Цей компонент буде відповідати за отримання всіх постів (наприклад, шляхом зчитування імен Markdown-файлів) і відображення їх у вигляді списку. Ви можете зберігати метадані (заголовок, опис) в окремому JSON-файлі або зчитувати їх з Front Matter кожного Markdown-файлу.

3.  **Створіть компонент посту (`BlogPostComponent`):** Це ключовий компонент для вашої стратегії.

      * Він буде отримувати параметр `slug` (ідентифікатор посту) з URL.
      * Завантажувати відповідний Markdown-файл з папки `src/assets/blog-posts/` на основі цього `slug`.
      * Використовувати бібліотеку, наприклад `ngx-markdown`, для парсингу вмісту Markdown у HTML та відображення його на сторінці.
      * Додатково, ви можете оновити метатеги (заголовок, опис) для SEO на основі Front Matter з Markdown-файлу.

## Приклад Markdown-файлу

```markdown
---
title: "Назва мого першого посту"
description: "Цей пост розповідає про..."
date: "2025-08-08"
---

# Заголовок
Текст мого посту...
```

## Генерація статичних сторінок (SSG)

Завдяки вашому налаштуванню SSG (`ng build --configuration=production`), Angular CLI під час збирання проєкту буде:

1.  Сканувати всі доступні маршрути.
2.  Генерувати окремий HTML-файл для кожного маршруту, включаючи динамічні маршрути блогу.
3.  Для генерації динамічних маршрутів вам потрібно буде надати список існуючих `slug` (ідентифікаторів постів), щоб Angular знав, які саме сторінки потрібно згенерувати. Це можна зробити за допомогою **Angular Universal** або, наприклад, окремого скрипту, який зчитуватиме імена ваших Markdown-файлів.