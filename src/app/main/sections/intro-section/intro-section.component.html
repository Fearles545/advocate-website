<section class="intro-section-bg">
  <div class="intro-glow"></div>
  <div class="intro-glow-secondary"></div>

  <div class="intro-section">
    <div class="intro-header">
      <div class="intro-header-badge">
        <img
          ngSrc="assets/logo/logo-white-transparent.png"
          alt=""
          width="316"
          height="169"
          priority
        />
      </div>

      <h1>
        <span class="profession-label">Адвокат з пенсійних питань</span>
        <span class="name-label">Поддяча Юлія Юріївна</span>
      </h1>

      <p class="intro-tagline">
        Юридична допомога з призначення та перерахунку пенсії, оскарження рішень
        Пенсійного фонду України
      </p>

      <!-- Photo appears here on mobile only -->
      <div class="intro-photo-mobile">
        <div class="photo-frame">
          <img
            class="main-photo"
            ngSrc="assets/images/main/main-image.webp"
            alt="Адвокат з пенсійних питань Поддяча Юлія Юріївна"
            placeholder="blur"
            width="742"
            height="1035"
            sizes="70vw"
            priority
          />
        </div>
      </div>

      <div class="location-badge">
        <mat-icon>language</mat-icon>

        <span class="location-text">
          Працюю з клієнтами по всій Україні та за кордоном. Консультації та
          супровід — онлайн
        </span>
      </div>

      <div class="intro-cta">
        <a href="tel:+380999426056" appCtaButton icon="call">
          Зателефонувати
        </a>

        <a routerLink="/services" class="cta-link">
          Перелік послуг
          <mat-icon>arrow_forward</mat-icon>
        </a>
      </div>

      <!-- <div class="trust-indicators">
        <div class="trust-item">
          <mat-icon>verified</mat-icon>
          <span>Практикуючий адвокат</span>
        </div>
        <span class="trust-divider">•</span>
        <div class="trust-item">
          <mat-icon>schedule</mat-icon>
          <span>Досвід з 2015 року</span>
        </div>
      </div> -->
    </div>

    <!-- Photo appears here on desktop only -->
    <div class="intro-photo-desktop">
      <div class="photo-frame">
        <img
          class="main-photo"
          ngSrc="assets/images/main/main-image.webp"
          alt="Адвокат з пенсійних питань Поддяча Юлія Юріївна"
          placeholder="blur"
          width="742"
          height="1035"
          sizes="35vw"
        />
      </div>
    </div>
  </div>

  <div class="decorative-element decorative-left">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M50 15L55 35H75L59 47L64 67L50 55L36 67L41 47L25 35H45L50 15Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  <div class="decorative-element decorative-right">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M50 15L55 35H75L59 47L64 67L50 55L36 67L41 47L25 35H45L50 15Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>
</section>
