<section class="feedback-section-bg">
  <div class="feedback-section">
    <h2>Відгуки клієнтів</h2>

    <div class="feedback-carousel">
      <button
        class="carousel-nav carousel-nav-prev"
        (click)="goToPrevious()"
        aria-label="Попередній відгук"
      >
        <mat-icon>arrow_back</mat-icon>
      </button>

      <div
        class="feedback-track"
        #feedbackTrack
        (scroll)="onScroll()"
        (mousedown)="onMouseDown($event)"
        (mousemove)="onMouseMove($event)"
        (mouseup)="onMouseUp()"
        (mouseleave)="onMouseLeave()"
      >
        @for (feedback of feedbacks(); track $index) {
          <article class="feedback-card">
            <div class="feedback-header">
              <div class="reviewer-avatar">
                <mat-icon>person</mat-icon>
              </div>
              <div class="reviewer-info">
                <h3 class="reviewer-name">{{ feedback.name }}</h3>
                <div class="rating">
                  <mat-icon class="star">star</mat-icon>
                  <mat-icon class="star">star</mat-icon>
                  <mat-icon class="star">star</mat-icon>
                  <mat-icon class="star">star</mat-icon>
                  <mat-icon class="star">star</mat-icon>
                </div>
              </div>
            </div>

            <div class="feedback-content">
              <mat-icon class="quote-icon">format_quote_outlined</mat-icon>
              <p class="feedback-text">{{ feedback.comment }}</p>
            </div>
          </article>
        }
      </div>

      <button
        class="carousel-nav carousel-nav-next"
        (click)="goToNext()"
        aria-label="Наступний відгук"
      >
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </div>

    <div class="feedback-dots">
      @for (feedback of feedbacks(); track $index) {
        <button
          class="dot"
          [class.active]="$index === currentFeedbackIndex()"
          (click)="goToFeedback($index)"
          [attr.aria-label]="'Перейти до відгуку ' + ($index + 1)"
        ></button>
      }
    </div>

    <div class="feedback-more-container">
      <a routerLink="/feedbacks" class="feedback-more-button">
        Усі відгуки
        <mat-icon>arrow_forward</mat-icon>
      </a>
    </div>
  </div>
</section>
