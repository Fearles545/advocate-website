<footer class="footer">
  <div class="container">
    <div class="left-content">
      <div class="left-top-content">
        <div class="center-content">
          <p class="description">
            Професійна допомога на всіх етапах оформлення пенсії ! Без вашої
            особистої присутності в органах Пенсійного фонду чи суді !
          </p>
        </div>

        <img
          class="logo"
          src="assets/logo/logo-white-transparent.png"
          alt="Адвокат Поддяча Юлія Юріївна"
        />
      </div>
    </div>

    <div class="social-icons">
      @for (iconData of socialMediaIconsData(); track iconData) {
        <app-social-icon-link
          [iconData]="iconData"
          [matTooltip]="iconData.name"
          [matTooltipShowDelay]="300"
          [matTooltipPosition]="'above'"
        />
      }

        <span class="phone">+38 (099) 942-60-56</span>
      </a> -->

  </div>

  <p class="copyright">

  </p>
