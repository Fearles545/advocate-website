<div class="contact-container">
  <div class="contact-info">
    <div class="left-content">
      <div class="center-content">
        <h2 class="center-content-title">Контакти адвоката</h2>

        <h2 class="center-content-value">Поддячої Юлії Юріївни</h2>
      </div>
    </div>

    <div class="contact-info-links-container">
      <a
        class="contact-info-item-container"
        href="mailto:yuliapoddyacha@gmail.com"
        target="_blank"
      >
        <p class="contact-info-item-header">
          E-mail
          <mat-icon class="new-window-icon"> open_in_new </mat-icon>
        </p>
        <p class="contact-info-item-value">yuliapoddyacha&#64;gmail.com</p>
      </a>

      <a
        class="contact-info-item-container"
        href="tel:+380999426056"
        target="_blank"
      >
        <p class="contact-info-item-header">
          Телефон
          <mat-icon class="new-window-icon"> open_in_new </mat-icon>
        </p>

        <p class="contact-info-item-value">+38 (099) 942-60-56</p>
      </a>

      <a
        class="contact-info-item-container"
        href="viber://chat?number=380999426056"
        target="_blank"
      >
        <p class="contact-info-item-header">
          Viber
          <mat-icon class="new-window-icon"> open_in_new </mat-icon>
        </p>
      </a>

      <a
        class="contact-info-item-container"
        href="https://t.me/yuliyuri"
        target="_blank"
      >
        <p class="contact-info-item-header">
          Telegram
          <mat-icon class="new-window-icon"> open_in_new </mat-icon>
        </p>
      </a>

      <a
        class="contact-info-item-container"
        href="https://wa.me/380999426056"
        target="_blank"
      >
        <p class="contact-info-item-header">
          Whatsapp
          <mat-icon class="new-window-icon"> open_in_new </mat-icon>
        </p>
      </a>
    </div>
  </div>

  <div class="consultation-container">
    <button
      class="consultation-btn"
      mat-fab
      extended
      (click)="openContactForm()"
    >
      <mat-icon style="overflow: visible">balance</mat-icon>
      Заявка на консультацію
    </button>
  </div>

  <div class="contact-photo-container">
    <img
      ngSrc="assets/contacts-photo.webp"
      alt="адвокат Юлія Поддяча"
      class="profile-photo"
      width="320"
      height="424"
      priority
    />
  </div>
</div>
